set -g mouse off
set -g history-limit 102400

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Neovim / terminal capabilities
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Pass modified keys (e.g. Shift+Enter for Claude Code) through to apps
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# OSC 8 hyperlinks (clickable links from apps like Claude Code, ls --hyperlink)
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "reloaded"

bind c new-window -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Pipe copies to the first clipboard tool found; with none, set-clipboard falls back to OSC 52
if-shell 'command -v xclip' "set -s copy-command 'xclip -selection clipboard'"
if-shell 'command -v wl-copy' "set -s copy-command 'wl-copy'"
if-shell 'command -v pbcopy' "set -s copy-command 'pbcopy'"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Status bar (Tokyo Night)
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
